<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Orb of Fate — a small raw WebGL and GLSL study of glass, stars, and motion."
    />
    <meta name="theme-color" content="#070707" />
    <link rel="icon" href="./site-icon.svg" type="image/svg+xml" />
    <title>Orb of Fate — GLSL study</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell" id="top">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span>orb</span>
        </div>
        <span class="stack-badge" id="rendererBadge" aria-live="polite">
          initializing renderer
        </span>
      </header>

      <main>
        <div class="hero-viewport">
          <section class="hero" id="experience">
            <p class="eyebrow">RAW WEBGL / HERO GLSL ES 1.00</p>
            <h1>Quiet light,<br /><span>uncertain orbit.</span></h1>
            <p class="lede">
              A small fragment-shader study in glass, parallax, and drifting star
              fields — built from scratch with no image textures.
            </p>

            <div class="hero-actions" aria-label="Shader controls">
              <button class="button button-primary" id="pauseToggle" type="button">
                Pause field
              </button>
              <button class="button button-secondary" id="shuffleButton" type="button">
                Re-seed orbs
              </button>
            </div>
          </section>

          <section class="orb-stage" aria-label="Orb carousel">
            <button
              class="carousel-arrow"
              id="previousOrb"
              type="button"
              aria-label="Previous orb"
            >
              ‹
            </button>
            <div class="orb-track" id="orbTrack"></div>
            <button
              class="carousel-arrow"
              id="nextOrb"
              type="button"
              aria-label="Next orb"
            >
              ›
            </button>

            <div class="orb-meta" aria-live="polite">
              <p class="meta-kicker" id="selectedIndexLabel">01 / 11</p>
              <h2 id="selectedOrbName">Aster</h2>
              <p id="selectedOrbDescription">A pale field with a soft blue edge.</p>
              <div class="meta-pills" id="selectedOrbTags" aria-label="Selected orb traits"></div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
